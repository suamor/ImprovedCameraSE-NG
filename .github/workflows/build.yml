name: Build ImprovedCameraSE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  COMMONLIB_DIR: ${{ github.workspace }}\ImprovedCamera\vendor\CommonLibSSE-NG
  COMMONLIB_BUILD_DIR: ${{ github.workspace }}\ImprovedCamera\vendor\CommonLibSSE-NG\build-ci

jobs:
  build-msvc:
    runs-on: windows-2022

    steps:
      - name: Checkout ImprovedCameraSE
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: master
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
          "%VCPKG_ROOT%\vcpkg.exe" version

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release --config Release --parallel 4

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImprovedCameraSE-MSVC-Release
          path: |
            build/release/**/*.dll
            build/release/**/*.pdb
            output/**/*.dll
          if-no-files-found: error
